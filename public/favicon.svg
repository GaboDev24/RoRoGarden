<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Fondo celeste agua -->
  <rect width="32" height="32" fill="#BFE6EE"/>
  <!-- Cuerpo del sapo: verde sapo -->
  <rect x="8" y="10" width="16" height="14" rx="4" fill="#8CC9A1"/>
  <!-- Contorno -->
  <rect x="7" y="9" width="18" height="16" rx="5" fill="none" stroke="#2B3A42" stroke-width="1.5"/>
  <!-- Vientre: crema luna -->
  <rect x="10" y="16" width="12" height="6" rx="3" fill="#F6EFC9"/>
  <!-- Ojo izquierdo -->
  <rect x="10" y="12" width="4" height="4" rx="2" fill="#2B3A42"/>
  <rect x="11" y="13" width="1.5" height="1.5" fill="#F6EFC9"/>
  <!-- Ojo derecho -->
  <rect x="18" y="12" width="4" height="4" rx="2" fill="#2B3A42"/>
  <rect x="19" y="13" width="1.5" height="1.5" fill="#F6EFC9"/>
</svg>

